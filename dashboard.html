<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Panel</title>
  <style>
    body{
      font-family: Arial;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
    }
    .wrap{
      width: 360px;
      padding: 20px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom: 14px;
      color:#333;
    }
    .card-btn{
      width:100%;
      border:none;
      cursor:pointer;
      background:white;
      padding:18px 16px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.10);
      text-align:left;
      font-size:16px;
      margin-bottom:12px;
      transition: transform .05s ease-in-out;
    }
    .card-btn:hover{ transform: translateY(-1px); }
    a.logout{
      font-size:14px;
      text-decoration:none;
      color:#444;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>Hoş geldin, <b>{{ username }}</b></div>
      <a class="logout" href="/logout">Çıkış</a>
    </div>

    <button class="card-btn" onclick="location.href='/stok-durum'">
      Stok Durum görüntüleme
    </button>

    <button class="card-btn" onclick="location.href='/stok-guncelle'">
      Stok Bilgi Güncelleme
    </button>

    <button class="card-btn" onclick="location.href='/yeni-urun'">
      Yeni Ürün tanımlama
    </button>

    <button class="card-btn" onclick="location.href='/urun-barkod'">
      Ürün barkod okuma
    </button>

    <button class="card-btn" onclick="location.href='/kullanici-bilgileri'">
      Kullanıcı Bilgileri
    </button>
  </div>
</body>
</html>
